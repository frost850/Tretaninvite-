<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0ecff"/>
      <stop offset="50%" stop-color="#e8e4f8"/>
      <stop offset="100%" stop-color="#faf7f0"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#e8c96b"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c5fc9"/>
      <stop offset="100%" stop-color="#6c7fdb"/>
    </linearGradient>
    <linearGradient id="photoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ede8f8"/>
      <stop offset="100%" stop-color="#faf7f0"/>
    </linearGradient>
    <clipPath id="photoClip">
      <ellipse cx="200" cy="188" rx="65" ry="80"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" fill="url(#bg)"/>

  <!-- Top decorative band -->
  <rect x="0" y="0" width="400" height="6" fill="url(#goldGrad)"/>

  <!-- Corner flourishes -->
  <text x="18" y="38" font-size="22" opacity=".4" fill="#c9a84c">✿</text>
  <text x="356" y="38" font-size="22" opacity=".4" fill="#c9a84c">✿</text>
  <text x="18" y="528" font-size="22" opacity=".4" fill="#c9a84c">✿</text>
  <text x="356" y="528" font-size="22" opacity=".4" fill="#c9a84c">✿</text>

  <!-- Scatter petals -->
  <text x="60" y="80" font-size="14" opacity=".25" fill="#6c7fdb">🌸</text>
  <text x="310" y="110" font-size="14" opacity=".25" fill="#c9a84c">✨</text>
  <text x="45" y="290" font-size="12" opacity=".2" fill="#6c7fdb">🌷</text>
  <text x="340" y="320" font-size="12" opacity=".2" fill="#c9a84c">⭐</text>

  <!-- ── HEADER ── -->
  <text x="200" y="58" font-family="Georgia,serif" font-size="9" letter-spacing="4" fill="#c9a84c" text-anchor="middle" font-style="italic">UNDANGAN WISUDA</text>

  <!-- Gold divider lines -->
  <line x1="60" y1="66" x2="145" y2="66" stroke="#c9a84c" stroke-width=".8" opacity=".6"/>
  <line x1="255" y1="66" x2="340" y2="66" stroke="#c9a84c" stroke-width=".8" opacity=".6"/>

  <!-- ── PHOTO FRAME ── -->
  <!-- Outer glow ring -->
  <ellipse cx="200" cy="188" rx="73" ry="88" fill="none" stroke="#c9a84c" stroke-width="2" opacity=".5"/>
  <!-- Photo placeholder -->
  <ellipse cx="200" cy="188" rx="65" ry="80" fill="url(#photoGrad)"/>
  <!-- Silhouette -->
  <ellipse cx="200" cy="172" rx="26" ry="30" fill="#c9a84c" opacity=".2"/>
  <ellipse cx="200" cy="220" rx="40" ry="28" fill="#c9a84c" opacity=".15"/>
  <!-- Graduation cap over photo -->
  <g transform="translate(200,112) scale(1)">
    <!-- Cap board -->
    <polygon points="-28,0 0,-16 28,0 0,16" fill="#2d2860" opacity=".85"/>
    <!-- Cap top -->
    <rect x="-14" y="-18" width="28" height="20" rx="3" fill="#4c5fc9" opacity=".85"/>
    <!-- Tassel -->
    <line x1="28" y1="0" x2="28" y2="22" stroke="#c9a84c" stroke-width="2"/>
    <circle cx="28" cy="24" r="3" fill="#c9a84c"/>
  </g>

  <!-- Photo border inner -->
  <ellipse cx="200" cy="188" rx="65" ry="80" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- Name placeholder -->
  <text x="200" y="295" font-family="Georgia,serif" font-size="22" font-weight="600" fill="#2d2860" text-anchor="middle" letter-spacing=".5">Aisyah Azzahra</text>
  <text x="200" y="314" font-family="Georgia,serif" font-size="10" fill="#6c7fdb" text-anchor="middle" letter-spacing="3" font-style="italic">Wisudawati</text>

  <!-- Gold separator -->
  <g transform="translate(200,328)">
    <line x1="-55" y1="0" x2="-15" y2="0" stroke="#c9a84c" stroke-width=".8" opacity=".7"/>
    <text x="0" y="5" font-size="10" fill="#c9a84c" text-anchor="middle">✿</text>
    <line x1="15" y1="0" x2="55" y2="0" stroke="#c9a84c" stroke-width=".8" opacity=".7"/>
  </g>

  <!-- University -->
  <text x="200" y="352" font-family="Georgia,serif" font-size="10" fill="#4c5fc9" text-anchor="middle" font-style="italic">Universitas Indonesia</text>
  <text x="200" y="368" font-family="Arial,sans-serif" font-size="8.5" fill="#6c7fdb" text-anchor="middle" letter-spacing=".5">Ilmu Komputer · Fakultas Ilmu Komputer</text>

  <!-- IPK Badge -->
  <rect x="148" y="378" width="104" height="20" rx="10" fill="#f5e9c8" stroke="#c9a84c" stroke-width=".8"/>
  <text x="200" y="392" font-family="Arial,sans-serif" font-size="8" fill="#7a5a10" text-anchor="middle" letter-spacing="1" font-weight="600">📜 IPK 3.92</text>

  <!-- ── EVENT CARDS ── -->
  <!-- Card 1 — Prosesi Wisuda -->
  <rect x="26" y="412" width="158" height="90" rx="10" fill="white" fill-opacity=".7" stroke="#c9a84c" stroke-width=".8"/>
  <text x="105" y="432" font-size="14" text-anchor="middle" fill="#4c5fc9">🎓</text>
  <text x="105" y="449" font-family="Arial,sans-serif" font-size="7" letter-spacing="2" fill="#c9a84c" text-anchor="middle" font-weight="600">PROSESI WISUDA</text>
  <text x="105" y="463" font-family="Georgia,serif" font-size="9" fill="#2d2860" text-anchor="middle">Sabtu, 14 Juni 2025</text>
  <text x="105" y="477" font-family="Arial,sans-serif" font-size="7.5" fill="#6c6c6c" text-anchor="middle">08.00 – 11.00 WIB</text>
  <text x="105" y="491" font-family="Arial,sans-serif" font-size="7" fill="#6c6c6c" text-anchor="middle">Gedung Balairung UI</text>

  <!-- Card 2 — Syukuran -->
  <rect x="218" y="412" width="158" height="90" rx="10" fill="white" fill-opacity=".7" stroke="#c9a84c" stroke-width=".8"/>
  <text x="297" y="432" font-size="14" text-anchor="middle" fill="#c9a84c">🥂</text>
  <text x="297" y="449" font-family="Arial,sans-serif" font-size="7" letter-spacing="2" fill="#c9a84c" text-anchor="middle" font-weight="600">SYUKURAN</text>
  <text x="297" y="463" font-family="Georgia,serif" font-size="9" fill="#2d2860" text-anchor="middle">Sabtu, 14 Juni 2025</text>
  <text x="297" y="477" font-family="Arial,sans-serif" font-size="7.5" fill="#6c6c6c" text-anchor="middle">13.00 – 16.00 WIB</text>
  <text x="297" y="491" font-family="Arial,sans-serif" font-size="7" fill="#6c6c6c" text-anchor="middle">Jl. Melati No.12, Depok</text>

  <!-- ── PREMIUM BADGE ── -->
  <rect x="150" y="512" width="100" height="22" rx="11" fill="url(#indigoGrad)"/>
  <text x="200" y="527" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle" letter-spacing="1.5" font-weight="700">⭐ PREMIUM</text>

  <!-- Bottom gold band -->
  <rect x="0" y="554" width="400" height="6" fill="url(#goldGrad)"/>
</svg>
