<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="300" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9f5"/>
      <stop offset="100%" stop-color="#fff0f5"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4a7b9"/>
      <stop offset="100%" stop-color="#c5b8e8"/>
    </linearGradient>
  </defs>
  <rect width="300" height="500" fill="url(#bg)" rx="16"/>

  <!-- Minimal petal deco -->
  <text x="18" y="50" font-size="14" opacity=".18" transform="rotate(-15,18,50)">🌸</text>
  <text x="260" y="35" font-size="11" opacity=".17" transform="rotate(20,260,35)">🌷</text>
  <text x="264" y="430" font-size="13" opacity=".18" transform="rotate(12,264,430)">🌼</text>

  <!-- Top -->
  <text x="150" y="34" text-anchor="middle" font-size="8" fill="#c5b8e8" letter-spacing="2" font-family="sans-serif">✿ Basic Patisserie</text>
  <rect x="90" y="38" width="120" height=".7" fill="url(#rose)" opacity=".35"/>

  <!-- Hero frames — simpler -->
  <rect x="65" y="50" width="78" height="102" rx="39" fill="#f9c8d8" stroke="#f4a7b9" stroke-width="1.2"/>
  <rect x="73" y="57" width="62" height="88" rx="31" fill="#fce4ec"/>
  <ellipse cx="104" cy="121" rx="16" ry="22" fill="#f4a7b9" opacity=".4"/>
  <circle cx="104" cy="98" r="10" fill="#f4a7b9" opacity=".4"/>

  <rect x="157" y="58" width="78" height="102" rx="39" fill="#e8e0f8" stroke="#c5b8e8" stroke-width="1.2"/>
  <rect x="165" y="65" width="62" height="88" rx="31" fill="#f3e8ff"/>
  <ellipse cx="196" cy="129" rx="16" ry="22" fill="#c5b8e8" opacity=".4"/>
  <circle cx="196" cy="106" r="10" fill="#c5b8e8" opacity=".4"/>

  <circle cx="150" cy="110" r="12" fill="white" stroke="#f4a7b9" stroke-width="1"/>
  <text x="150" y="115" text-anchor="middle" font-size="10" fill="#c5b8e8" font-family="Georgia,serif">&amp;</text>

  <!-- Names — no full name / social -->
  <text x="150" y="186" text-anchor="middle" font-size="10" fill="#b07a9a" font-family="Georgia,serif" font-style="italic">Siti Nurhaliza</text>
  <text x="150" y="200" text-anchor="middle" font-size="14" fill="#c5b8e8" font-family="Georgia,serif">&amp;</text>
  <text x="150" y="214" text-anchor="middle" font-size="10" fill="#b07a9a" font-family="Georgia,serif" font-style="italic">Ahmad Dhani</text>
  <rect x="100" y="219" width="100" height=".7" fill="url(#rose)" opacity=".45"/>
  <text x="150" y="232" text-anchor="middle" font-size="8" fill="#c5b8e8" letter-spacing="1">Sabtu, 14 Maret 2026</text>

  <!-- Divider -->
  <text x="150" y="254" text-anchor="middle" font-size="10" fill="#f4a7b9" opacity=".5">✿</text>

  <!-- Events — just akad + resepsi, no dresscode -->
  <rect x="30" y="264" width="115" height="76" rx="7" fill="white" opacity=".8" stroke="#f4a7b9" stroke-width=".7"/>
  <text x="87" y="286" text-anchor="middle" font-size="17" fill="#f4a7b9">🌙</text>
  <text x="87" y="304" text-anchor="middle" font-size="8" fill="#b07a9a" font-family="Georgia,serif">Akad Nikah</text>
  <text x="87" y="318" text-anchor="middle" font-size="7" fill="#b07a9a" opacity=".6">08.00 WIB</text>
  <text x="87" y="330" text-anchor="middle" font-size="6" fill="#c5b8e8" opacity=".65">Grand Ballroom</text>

  <rect x="155" y="264" width="115" height="76" rx="7" fill="white" opacity=".8" stroke="#c5b8e8" stroke-width=".7"/>
  <text x="212" y="286" text-anchor="middle" font-size="17" fill="#c5b8e8">🌸</text>
  <text x="212" y="304" text-anchor="middle" font-size="8" fill="#b07a9a" font-family="Georgia,serif">Resepsi</text>
  <text x="212" y="318" text-anchor="middle" font-size="7" fill="#b07a9a" opacity=".6">11.00 WIB</text>
  <text x="212" y="330" text-anchor="middle" font-size="6" fill="#c5b8e8" opacity=".65">Hotel Mulia</text>

  <!-- Map placeholder -->
  <rect x="30" y="354" width="240" height="70" rx="6" fill="white" opacity=".7" stroke="#e0d0f0" stroke-width=".8"/>
  <text x="150" y="395" text-anchor="middle" font-size="22" fill="#c5b8e8" opacity=".3">🗺️</text>
  <text x="150" y="414" text-anchor="middle" font-size="7" fill="#b07a9a" opacity=".5" letter-spacing="1">LOKASI ACARA</text>

  <!-- RSVP button -->
  <rect x="70" y="436" width="160" height="28" rx="14" fill="url(#rose)" opacity=".7"/>
  <text x="150" y="454" text-anchor="middle" font-size="9" fill="white" font-family="sans-serif">Konfirmasi Kehadiran 🌸</text>

  <text x="150" y="484" text-anchor="middle" font-size="7" fill="#b07a9a" letter-spacing="2" opacity=".6">✿ BASIC · PASTEL PATISSERIE</text>
</svg>
