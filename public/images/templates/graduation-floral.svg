<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0f5"/>
      <stop offset="100%" stop-color="#fdf2f8"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#db7093"/>
      <stop offset="100%" stop-color="#e87fa8"/>
    </linearGradient>
    <linearGradient id="photoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fdf2f8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" fill="url(#bg)"/>

  <!-- Top bar rose -->
  <rect x="0" y="0" width="400" height="5" fill="url(#roseGrad)"/>

  <!-- Floral corners -->
  <text x="10" y="35" font-size="22" opacity=".35">🌸</text>
  <text x="356" y="35" font-size="22" opacity=".35">🌺</text>
  <text x="10" y="548" font-size="22" opacity=".35">🌺</text>
  <text x="356" y="548" font-size="22" opacity=".35">🌸</text>

  <!-- Scattered florals -->
  <text x="58" y="92" font-size="11" opacity=".2">🌸</text>
  <text x="325" y="125" font-size="11" opacity=".2">🌺</text>
  <text x="42" y="340" font-size="10" opacity=".15">🌷</text>
  <text x="342" y="370" font-size="10" opacity=".15">🌸</text>

  <!-- Header -->
  <text x="200" y="54" font-family="Georgia,serif" font-size="8" letter-spacing="5" fill="#db7093" text-anchor="middle" font-style="italic">UNDANGAN WISUDA</text>

  <!-- Floral divider -->
  <text x="92" y="67" font-size="9" fill="#db7093" opacity=".6">🌸</text>
  <line x1="112" y1="64" x2="162" y2="64" stroke="#db7093" stroke-width=".6" opacity=".4"/>
  <text x="196" y="69" font-size="10" fill="#db7093" opacity=".8">🌺</text>
  <line x1="224" y1="64" x2="278" y2="64" stroke="#db7093" stroke-width=".6" opacity=".4"/>
  <text x="295" y="67" font-size="9" fill="#db7093" opacity=".6">🌸</text>

  <!-- Photo frame - floral ellipse -->
  <ellipse cx="200" cy="188" rx="70" ry="86" fill="url(#photoGrad)" stroke="#db7093" stroke-width="1.5" opacity=".6"/>
  <ellipse cx="200" cy="188" rx="62" ry="78" fill="none" stroke="#db7093" stroke-width=".4" opacity=".3"/>
  <!-- Silhouette -->
  <ellipse cx="200" cy="170" rx="24" ry="28" fill="#db7093" opacity=".18"/>
  <ellipse cx="200" cy="214" rx="38" ry="24" fill="#db7093" opacity=".12"/>
  <!-- Cap floral -->
  <g transform="translate(200,114)">
    <polygon points="-24,0 0,-13 24,0 0,13" fill="#9b1f45" opacity=".85"/>
    <rect x="-12" y="-15" width="24" height="17" rx="2" fill="#be185d" opacity=".85"/>
    <line x1="24" y1="0" x2="24" y2="20" stroke="#f9a8d4" stroke-width="1.5"/>
    <circle cx="24" cy="23" r="3" fill="#f9a8d4"/>
  </g>

  <!-- Name -->
  <text x="200" y="298" font-family="Georgia,serif" font-size="20" font-weight="600" fill="#9b1f45" text-anchor="middle" letter-spacing=".5">Nama Wisudawan</text>
  <text x="200" y="316" font-family="Arial,sans-serif" font-size="8" fill="#db7093" text-anchor="middle" letter-spacing="3">WISUDAWAN</text>

  <!-- Floral divider -->
  <line x1="80" y1="330" x2="172" y2="330" stroke="#db7093" stroke-width=".6" opacity=".4"/>
  <text x="196" y="335" font-size="10" fill="#db7093" opacity=".8">🌸</text>
  <line x1="220" y1="330" x2="318" y2="330" stroke="#db7093" stroke-width=".6" opacity=".4"/>

  <!-- University -->
  <text x="200" y="356" font-family="Georgia,serif" font-size="9" font-style="italic" fill="#be185d" text-anchor="middle" opacity=".75">Universitas · Program Studi</text>
  <text x="200" y="372" font-family="Arial,sans-serif" font-size="8" fill="#f9a8d4" text-anchor="middle">IPK : 3.90</text>

  <!-- Event card floral -->
  <rect x="60" y="390" width="280" height="80" rx="8" fill="rgba(219,112,147,0.06)" stroke="#db7093" stroke-width=".8" opacity=".3"/>
  <text x="86" y="416" font-size="16">🎓</text>
  <text x="114" y="415" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#9b1f45" letter-spacing="1">PROSESI WISUDA</text>
  <text x="114" y="430" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#db7093">Senin, 4 Maret 2026</text>
  <text x="114" y="445" font-family="Arial,sans-serif" font-size="7.5" fill="#e87fa8" opacity=".8">Gedung Wisuda Universitas · 08.00 WIB</text>

  <!-- WA Button floral -->
  <rect x="76" y="482" width="248" height="33" rx="16.5" fill="url(#roseGrad)"/>
  <text x="200" y="503" font-family="Arial,sans-serif" font-size="8.5" fill="#fff0f5" text-anchor="middle" letter-spacing="1">Kirim Ucapan via WhatsApp</text>

  <!-- Bottom floral row -->
  <text x="180" y="518" font-size="10" opacity=".3">🌸</text>
  <text x="196" y="520" font-size="12" opacity=".4">🌺</text>
  <text x="213" y="518" font-size="10" opacity=".3">🌸</text>
  <text x="200" y="537" font-family="Georgia,serif" font-size="8" fill="#db7093" text-anchor="middle" font-style="italic" opacity=".5">graduation · floral · cantik</text>
</svg>
