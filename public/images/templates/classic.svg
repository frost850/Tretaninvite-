  <rect width="300" height="500" fill="url(#bg)" rx="16"/>

  <!-- Gold border frame -->
  <rect x="14" y="14" width="272" height="472" rx="8" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity=".5"/>
