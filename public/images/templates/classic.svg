  <text x="271" y="36" font-size="12" fill="#b8892a" opacity=".6" transform="scale(-1,1) translate(-542,0)">❧</text>
  <text x="20" y="488" font-size="12" fill="#b8892a" opacity=".6" transform="scale(1,-1) translate(0,-976)">❧</text>
