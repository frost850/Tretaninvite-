<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="300" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1208"/>
      <stop offset="50%" stop-color="#2a1d08"/>
      <stop offset="100%" stop-color="#0f0a02"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#92700a"/>
      <stop offset="30%" stop-color="#d4a017"/>
      <stop offset="50%" stop-color="#f5e17a"/>
      <stop offset="70%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#92700a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4a017" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#d4a017" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="500" fill="url(#bg)" rx="16"/>

  <!-- Central glow -->
  <ellipse cx="150" cy="200" rx="130" ry="180" fill="url(#glow)"/>

  <!-- Stars scattered -->
  <circle cx="35" cy="45" r="1" fill="#f5e17a" opacity=".8"/>
  <circle cx="70" cy="25" r="1.2" fill="#f5e17a" opacity=".6"/>
  <circle cx="230" cy="35" r="1" fill="#f5e17a" opacity=".7"/>
  <circle cx="265" cy="60" r="1.3" fill="#f5e17a" opacity=".9"/>
  <circle cx="140" cy="18" r="1" fill="#f5e17a" opacity=".5"/>
  <circle cx="20" cy="200" r="1" fill="#d4a017" opacity=".5"/>
  <circle cx="280" cy="160" r="1.1" fill="#d4a017" opacity=".6"/>
  <circle cx="15" cy="380" r="1.2" fill="#f5e17a" opacity=".4"/>
  <circle cx="285" cy="340" r="1" fill="#f5e17a" opacity=".5"/>
  <circle cx="50" cy="460" r="1" fill="#d4a017" opacity=".4"/>
  <circle cx="250" cy="470" r="1.2" fill="#d4a017" opacity=".5"/>

  <!-- ◈ icon -->
  <text x="150" y="38" text-anchor="middle" font-size="10" fill="#d4a017">◈</text>
  <rect x="50" y="42" width="90" height=".8" fill="url(#gold)" opacity=".5"/>
  <rect x="160" y="42" width="90" height=".8" fill="url(#gold)" opacity=".5"/>

  <!-- 3D Frame photo -->
  <rect x="70" y="52" width="160" height="170" rx="4" fill="#1a1208" stroke="#92700a" stroke-width="2"/>
  <!-- 3D shadow effect -->
  <rect x="76" y="58" width="160" height="170" rx="4" fill="#0a0601" opacity=".5"/>
  <rect x="74" y="56" width="156" height="166" rx="3" fill="#12100a"/>
  <!-- Glow on frame -->
  <rect x="76" y="58" width="152" height="162" rx="2" fill="none" stroke="#d4a017" stroke-width=".5" opacity=".4"/>

  <!-- Silhouette -->
  <ellipse cx="150" cy="185" rx="38" ry="42" fill="#1a1208"/>
  <circle cx="150" cy="143" r="26" fill="#1a1208"/>
  <text x="150" y="175" text-anchor="middle" font-size="34" fill="#d4a017" opacity=".15">◈</text>

  <!-- Gold star ornaments -->
  <text x="78" y="72" font-size="8" fill="#d4a017" opacity=".5">★</text>
  <text x="216" y="72" font-size="8" fill="#d4a017" opacity=".5">★</text>
  <text x="78" y="218" font-size="8" fill="#d4a017" opacity=".5">★</text>
  <text x="216" y="218" font-size="8" fill="#d4a017" opacity=".5">★</text>

  <!-- Names -->
  <text x="150" y="252" text-anchor="middle" font-size="11" fill="#d4a017" font-family="Georgia,serif" font-style="italic">Siti Nurhaliza</text>
  <rect x="115" y="256" width="70" height=".8" fill="url(#gold)" opacity=".5"/>
  <text x="150" y="268" text-anchor="middle" font-size="14" fill="#f5e17a" font-family="Georgia,serif">&amp;</text>
  <rect x="115" y="271" width="70" height=".8" fill="url(#gold)" opacity=".5"/>
  <text x="150" y="283" text-anchor="middle" font-size="11" fill="#d4a017" font-family="Georgia,serif" font-style="italic">Ahmad Dhani</text>
  <text x="150" y="296" text-anchor="middle" font-size="7" fill="#92700a" letter-spacing="3">SABTU, 14 MARET 2026</text>

  <!-- Countdown 3D style -->
  <rect x="28" y="308" width="244" height="48" rx="4" fill="#12100a" stroke="#92700a" stroke-width=".8"/>
  <rect x="30" y="310" width="240" height="44" rx="3" fill="#1a1208"/>
  <text x="78" y="328" text-anchor="middle" font-size="18" fill="#f5e17a" font-family="Georgia,serif" font-weight="bold">32</text>
  <text x="78" y="346" text-anchor="middle" font-size="6" fill="#92700a" letter-spacing="1">HARI</text>
  <text x="118" y="336" text-anchor="middle" font-size="16" fill="#d4a017">:</text>
  <text x="150" y="328" text-anchor="middle" font-size="18" fill="#f5e17a" font-family="Georgia,serif" font-weight="bold">08</text>
  <text x="150" y="346" text-anchor="middle" font-size="6" fill="#92700a" letter-spacing="1">JAM</text>
  <text x="182" y="336" text-anchor="middle" font-size="16" fill="#d4a017">:</text>
  <text x="222" y="328" text-anchor="middle" font-size="18" fill="#f5e17a" font-family="Georgia,serif" font-weight="bold">45</text>
  <text x="222" y="346" text-anchor="middle" font-size="6" fill="#92700a" letter-spacing="1">MENIT</text>

  <!-- Event cards dark gold -->
  <rect x="28" y="368" width="115" height="75" rx="3" fill="#12100a" stroke="#92700a" stroke-width=".8"/>
  <text x="85" y="390" text-anchor="middle" font-size="8" fill="#d4a017" letter-spacing="1">AKAD NIKAH</text>
  <rect x="46" y="394" width="78" height=".5" fill="#92700a" opacity=".5"/>
  <text x="85" y="408" text-anchor="middle" font-size="7" fill="#c8a44a">14 Maret 2026</text>
  <text x="85" y="420" text-anchor="middle" font-size="7" fill="#92700a">08.00 WIB</text>
  <text x="85" y="432" text-anchor="middle" font-size="6" fill="#6b5010">Grand Ballroom</text>

  <rect x="157" y="368" width="115" height="75" rx="3" fill="#12100a" stroke="#92700a" stroke-width=".8"/>
  <text x="214" y="390" text-anchor="middle" font-size="8" fill="#d4a017" letter-spacing="1">RESEPSI</text>
  <rect x="175" y="394" width="78" height=".5" fill="#92700a" opacity=".5"/>
  <text x="214" y="408" text-anchor="middle" font-size="7" fill="#c8a44a">14 Maret 2026</text>
  <text x="214" y="420" text-anchor="middle" font-size="7" fill="#92700a">11.00 WIB</text>
  <text x="214" y="432" text-anchor="middle" font-size="6" fill="#6b5010">Hotel Mulia</text>

  <rect x="50" y="456" width="200" height=".8" fill="url(#gold)" opacity=".35"/>
  <text x="150" y="472" text-anchor="middle" font-size="7" fill="#92700a" letter-spacing="3">LUXURY 3D · GOLD DARK</text>
  <text x="150" y="484" text-anchor="middle" font-size="8" fill="#d4a017" opacity=".4">◈ ★ ◈</text>
</svg>
