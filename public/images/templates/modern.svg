<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="300" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="300" height="500" fill="url(#bg)" rx="16"/>

  <!-- Geometric accent lines -->
  <rect x="30" y="30" width="1" height="440" fill="#334155" opacity=".5"/>
  <rect x="269" y="30" width="1" height="440" fill="#334155" opacity=".5"/>
  <rect x="30" y="30" width="240" height="1" fill="#334155" opacity=".5"/>
  <rect x="30" y="470" width="240" height="1" fill="#334155" opacity=".5"/>

  <!-- Diamond accent -->
  <text x="150" y="44" text-anchor="middle" font-size="10" fill="#64748b">◆</text>
  <text x="30" y="44" font-size="8" fill="#475569">◆</text>
  <text x="258" y="44" font-size="8" fill="#475569">◆</text>

  <!-- Header -->
  <text x="150" y="38" text-anchor="middle" font-size="7.5" fill="#94a3b8" letter-spacing="4" font-family="sans-serif">MODERN DARK WEDDING</text>

  <!-- Full bleed photo sim -->
  <rect x="50" y="55" width="200" height="200" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="52" y="57" width="196" height="196" fill="#0f172a" opacity=".7"/>
  <ellipse cx="150" cy="197" rx="45" ry="50" fill="#1e293b"/>
  <circle cx="150" cy="147" r="34" fill="#1e293b"/>
  <!-- Geometric overlay lines -->
  <rect x="50" y="55" width="200" height="1" fill="#475569" opacity=".5"/>
  <rect x="50" y="254" width="200" height="1" fill="#475569" opacity=".5"/>
  <rect x="50" y="55" width="1" height="200" fill="#475569" opacity=".5"/>
  <rect x="249" y="55" width="1" height="200" fill="#475569" opacity=".5"/>

  <!-- Names on dark -->
  <text x="150" y="285" text-anchor="middle" font-size="20" fill="#f8fafc" font-family="Georgia,serif" font-style="italic">Siti &amp; Ahmad</text>
  <rect x="80" y="291" width="140" height=".8" fill="#475569"/>
  <text x="150" y="306" text-anchor="middle" font-size="7.5" fill="#94a3b8" letter-spacing="3" font-family="sans-serif">SABTU, 14 MARET 2026</text>

  <!-- Events dark cards -->
  <rect x="30" y="324" width="115" height="76" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="87" y="342" text-anchor="middle" font-size="7" fill="#64748b" letter-spacing="2">AKAD NIKAH</text>
  <rect x="50" y="346" width="74" height=".5" fill="#334155"/>
  <text x="87" y="360" text-anchor="middle" font-size="8" fill="#cbd5e1" font-family="Georgia,serif">14 Maret 2026</text>
  <text x="87" y="374" text-anchor="middle" font-size="7" fill="#94a3b8">08.00 WIB</text>
  <text x="87" y="388" text-anchor="middle" font-size="6.5" fill="#64748b">Grand Ballroom</text>

  <rect x="155" y="324" width="115" height="76" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="212" y="342" text-anchor="middle" font-size="7" fill="#64748b" letter-spacing="2">RESEPSI</text>
  <rect x="175" y="346" width="74" height=".5" fill="#334155"/>
  <text x="212" y="360" text-anchor="middle" font-size="8" fill="#cbd5e1" font-family="Georgia,serif">14 Maret 2026</text>
  <text x="212" y="374" text-anchor="middle" font-size="7" fill="#94a3b8">11.00 WIB</text>
  <text x="212" y="388" text-anchor="middle" font-size="6.5" fill="#64748b">Hotel Mulia</text>

  <!-- Countdown minimal dark -->
  <rect x="30" y="412" width="240" height="32" fill="#0f172a" stroke="#334155" stroke-width=".8"/>
  <text x="80" y="424" text-anchor="middle" font-size="14" fill="#f8fafc" font-family="Georgia,serif" font-weight="bold">32</text>
  <text x="80" y="436" text-anchor="middle" font-size="5.5" fill="#64748b" letter-spacing="1">HARI</text>
  <text x="110" y="430" text-anchor="middle" font-size="12" fill="#334155">:</text>
  <text x="150" y="424" text-anchor="middle" font-size="14" fill="#f8fafc" font-family="Georgia,serif" font-weight="bold">08</text>
  <text x="150" y="436" text-anchor="middle" font-size="5.5" fill="#64748b" letter-spacing="1">JAM</text>
  <text x="190" y="430" text-anchor="middle" font-size="12" fill="#334155">:</text>
  <text x="220" y="424" text-anchor="middle" font-size="14" fill="#f8fafc" font-family="Georgia,serif" font-weight="bold">45</text>
  <text x="220" y="436" text-anchor="middle" font-size="5.5" fill="#64748b" letter-spacing="1">MENIT</text>

  <text x="150" y="480" text-anchor="middle" font-size="7" fill="#475569" letter-spacing="3">◆ MODERN DARK WEDDING ◆</text>
</svg>
