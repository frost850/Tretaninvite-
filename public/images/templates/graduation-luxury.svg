<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0800"/>
      <stop offset="50%" stop-color="#1a1200"/>
      <stop offset="100%" stop-color="#0a0600"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#f0d878"/>
    </linearGradient>
    <linearGradient id="photoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1200"/>
      <stop offset="100%" stop-color="#2a1e00"/>
    </linearGradient>
  </defs>

  <!-- Background dark -->
  <rect width="400" height="560" fill="url(#bg)"/>

  <!-- Stars scattered -->
  <circle cx="30" cy="40" r="1" fill="#c9a84c" opacity=".5"/>
  <circle cx="80" cy="90" r=".7" fill="#f0d878" opacity=".4"/>
  <circle cx="340" cy="55" r="1.2" fill="#c9a84c" opacity=".6"/>
  <circle cx="370" cy="120" r=".8" fill="#f0d878" opacity=".3"/>
  <circle cx="50" cy="200" r=".9" fill="#c9a84c" opacity=".4"/>
  <circle cx="360" cy="290" r="1" fill="#f0d878" opacity=".5"/>
  <circle cx="20" cy="420" r=".7" fill="#c9a84c" opacity=".3"/>
  <circle cx="380" cy="460" r="1.1" fill="#f0d878" opacity=".4"/>
  <circle cx="150" cy="30" r=".8" fill="#c9a84c" opacity=".3"/>
  <circle cx="280" cy="500" r=".9" fill="#f0d878" opacity=".4"/>

  <!-- Gold border -->
  <rect x="8" y="8" width="384" height="544" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity=".5"/>
  <rect x="14" y="14" width="372" height="532" fill="none" stroke="#c9a84c" stroke-width=".4" opacity=".3"/>

  <!-- Corner gems -->
  <text x="18" y="36" font-size="14" fill="#c9a84c" opacity=".7">◈</text>
  <text x="368" y="36" font-size="14" fill="#c9a84c" opacity=".7">◈</text>
  <text x="18" y="548" font-size="14" fill="#c9a84c" opacity=".7">◈</text>
  <text x="368" y="548" font-size="14" fill="#c9a84c" opacity=".7">◈</text>

  <!-- Header -->
  <text x="200" y="56" font-family="Georgia,serif" font-size="8" letter-spacing="5" fill="#c9a84c" text-anchor="middle">UNDANGAN WISUDA</text>
  <line x1="60" y1="64" x2="160" y2="64" stroke="#c9a84c" stroke-width=".7" opacity=".6"/>
  <text x="200" y="69" font-size="8" fill="#c9a84c" text-anchor="middle">◈</text>
  <line x1="240" y1="64" x2="340" y2="64" stroke="#c9a84c" stroke-width=".7" opacity=".6"/>

  <!-- Photo frame luxury ellipse -->
  <ellipse cx="200" cy="196" rx="76" ry="92" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity=".6"/>
  <ellipse cx="200" cy="196" rx="68" ry="84" fill="url(#photoGrad)"/>
  <!-- Silhouette -->
  <ellipse cx="200" cy="178" rx="26" ry="30" fill="#c9a84c" opacity=".15"/>
  <ellipse cx="200" cy="222" rx="42" ry="28" fill="#c9a84c" opacity=".1"/>
  <!-- Cap luxury -->
  <g transform="translate(200,118)">
    <polygon points="-26,0 0,-14 26,0 0,14" fill="#c9a84c" opacity=".9"/>
    <rect x="-13" y="-16" width="26" height="18" rx="3" fill="#4c5fc9" opacity=".9"/>
    <line x1="26" y1="0" x2="26" y2="22" stroke="#f0d878" stroke-width="2"/>
    <circle cx="26" cy="25" r="3.5" fill="#f0d878"/>
  </g>

  <!-- Name luxury -->
  <text x="200" y="308" font-family="Georgia,serif" font-size="20" font-weight="600" fill="#f0d878" text-anchor="middle" letter-spacing=".5">Nama Wisudawan</text>
  <text x="200" y="326" font-family="Arial,sans-serif" font-size="8" fill="#c9a84c" text-anchor="middle" letter-spacing="3">WISUDAWAN</text>

  <!-- Gold gem divider -->
  <line x1="80" y1="340" x2="180" y2="340" stroke="#c9a84c" stroke-width=".7" opacity=".5"/>
  <text x="200" y="346" font-size="10" fill="#c9a84c" text-anchor="middle">◈</text>
  <line x1="220" y1="340" x2="320" y2="340" stroke="#c9a84c" stroke-width=".7" opacity=".5"/>

  <!-- University -->
  <text x="200" y="366" font-family="Georgia,serif" font-size="9" font-style="italic" fill="#c9a84c" text-anchor="middle" opacity=".7">Universitas · Program Studi</text>

  <!-- Event card luxury -->
  <rect x="60" y="382" width="280" height="84" rx="4" fill="rgba(201,168,76,0.06)" stroke="#c9a84c" stroke-width=".7" opacity=".4"/>
  <text x="88" y="410" font-size="16">🎓</text>
  <text x="116" y="408" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#f0d878" letter-spacing="1">PROSESI WISUDA</text>
  <text x="116" y="424" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#c9a84c">Senin, 4 Maret 2026</text>
  <text x="116" y="439" font-family="Arial,sans-serif" font-size="7.5" fill="#c9a84c" opacity=".7">Gedung Wisuda Universitas</text>
  <text x="116" y="453" font-family="Arial,sans-serif" font-size="7.5" fill="#c9a84c" opacity=".7">08.00 WIB</text>

  <!-- WA Button luxury gold -->
  <rect x="80" y="482" width="240" height="34" rx="17" fill="url(#goldGrad)"/>
  <text x="200" y="504" font-family="Arial,sans-serif" font-size="9" fill="#1a1200" text-anchor="middle" font-weight="700" letter-spacing="1">Kirim Ucapan via WhatsApp</text>

  <!-- Bottom -->
  <text x="200" y="536" font-family="Georgia,serif" font-size="8" fill="#c9a84c" text-anchor="middle" font-style="italic" opacity=".5">graduation · luxury · prestisius</text>
</svg>
