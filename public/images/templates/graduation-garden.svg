<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="photoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" fill="url(#bg)"/>

  <!-- Top bar green -->
  <rect x="0" y="0" width="400" height="5" fill="url(#greenGrad)"/>

  <!-- Leaf ornaments corner -->
  <text x="12" y="36" font-size="20" opacity=".35">🌿</text>
  <text x="358" y="36" font-size="20" opacity=".35">🍃</text>
  <text x="12" y="548" font-size="20" opacity=".35">🍃</text>
  <text x="358" y="548" font-size="20" opacity=".35">🌿</text>

  <!-- Scattered leaves -->
  <text x="55" y="95" font-size="11" opacity=".2">🌿</text>
  <text x="330" y="130" font-size="11" opacity=".2">🍃</text>
  <text x="40" y="350" font-size="10" opacity=".15">🌿</text>
  <text x="345" y="380" font-size="10" opacity=".15">🍃</text>

  <!-- Header -->
  <text x="200" y="56" font-family="Georgia,serif" font-size="8" letter-spacing="5" fill="#15803d" text-anchor="middle">UNDANGAN WISUDA</text>

  <!-- Leaf row divider -->
  <text x="95" y="68" font-size="9" fill="#16a34a" opacity=".5">🌿</text>
  <line x1="112" y1="65" x2="165" y2="65" stroke="#16a34a" stroke-width=".6" opacity=".4"/>
  <text x="195" y="70" font-size="10" fill="#16a34a" opacity=".7">🍃</text>
  <line x1="222" y1="65" x2="275" y2="65" stroke="#16a34a" stroke-width=".6" opacity=".4"/>
  <text x="291" y="68" font-size="9" fill="#16a34a" opacity=".5">🌿</text>

  <!-- Photo frame - rounded rect with leaf border feel -->
  <rect x="144" y="88" width="112" height="144" rx="56" fill="url(#photoGrad)" stroke="#16a34a" stroke-width="1.5" opacity=".6"/>
  <!-- Silhouette -->
  <ellipse cx="200" cy="148" rx="22" ry="26" fill="#16a34a" opacity=".18"/>
  <ellipse cx="200" cy="194" rx="36" ry="22" fill="#16a34a" opacity=".12"/>
  <!-- Cap green themed -->
  <g transform="translate(200,104)">
    <polygon points="-22,0 0,-12 22,0 0,12" fill="#14532d" opacity=".85"/>
    <rect x="-11" y="-14" width="22" height="16" rx="2" fill="#166534" opacity=".85"/>
    <line x1="22" y1="0" x2="22" y2="18" stroke="#4ade80" stroke-width="1.5"/>
    <circle cx="22" cy="20" r="3" fill="#4ade80"/>
  </g>

  <!-- Name -->
  <text x="200" y="264" font-family="Georgia,serif" font-size="20" font-weight="600" fill="#14532d" text-anchor="middle" letter-spacing=".5">Nama Wisudawan</text>
  <text x="200" y="282" font-family="Arial,sans-serif" font-size="8" fill="#16a34a" text-anchor="middle" letter-spacing="3">WISUDAWAN</text>

  <!-- G-div divider -->
  <line x1="80" y1="296" x2="172" y2="296" stroke="#16a34a" stroke-width=".8" opacity=".4"/>
  <text x="196" y="301" font-size="10" fill="#16a34a" opacity=".8">🌿</text>
  <line x1="222" y1="296" x2="320" y2="296" stroke="#16a34a" stroke-width=".8" opacity=".4"/>

  <!-- University info -->
  <text x="200" y="320" font-family="Georgia,serif" font-size="9" font-style="italic" fill="#166534" text-anchor="middle">Universitas · Program Studi</text>
  <text x="200" y="337" font-family="Arial,sans-serif" font-size="8" fill="#4ade80" text-anchor="middle" opacity=".8">IPK : 3.90</text>

  <!-- Event card -->
  <rect x="60" y="356" width="280" height="82" rx="8" fill="rgba(22,163,74,0.07)" stroke="#16a34a" stroke-width=".8" opacity=".35"/>
  <text x="88" y="384" font-size="16">🎓</text>
  <text x="116" y="383" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#14532d" letter-spacing="1">PROSESI WISUDA</text>
  <text x="116" y="399" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#166534">Senin, 4 Maret 2026</text>
  <text x="116" y="414" font-family="Arial,sans-serif" font-size="7.5" fill="#4ade80" opacity=".8">Gedung Wisuda Universitas</text>
  <text x="116" y="427" font-family="Arial,sans-serif" font-size="7.5" fill="#4ade80" opacity=".8">08.00 WIB</text>

  <!-- WA Button green -->
  <rect x="80" y="454" width="240" height="32" rx="16" fill="url(#greenGrad)"/>
  <text x="200" y="475" font-family="Arial,sans-serif" font-size="8.5" fill="#f0fdf4" text-anchor="middle" letter-spacing="1">Kirim Ucapan via WhatsApp</text>

  <!-- Bottom leaf row -->
  <text x="180" y="516" font-size="10" opacity=".3">🌿</text>
  <text x="196" y="518" font-size="12" opacity=".4">🍃</text>
  <text x="214" y="516" font-size="10" opacity=".3">🌿</text>
  <text x="200" y="534" font-family="Georgia,serif" font-size="8" fill="#16a34a" text-anchor="middle" font-style="italic" opacity=".5">graduation · garden · alami</text>
</svg>
