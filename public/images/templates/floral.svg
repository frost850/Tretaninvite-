<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="300" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0f5"/>
      <stop offset="100%" stop-color="#ffe4f0"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="300" height="500" fill="url(#bg)" rx="16"/>

  <!-- Dense floral deco -->
  <text x="0" y="60" font-size="36" opacity=".12" transform="rotate(-20,0,60)">🌸</text>
  <text x="230" y="30" font-size="40" opacity=".1" transform="rotate(25,230,30)">🌷</text>
  <text x="-10" y="280" font-size="50" opacity=".08" transform="rotate(-15,-10,280)">🌺</text>
  <text x="240" y="300" font-size="44" opacity=".1" transform="rotate(20,240,300)">🌸</text>
  <text x="60" y="490" font-size="38" opacity=".1" transform="rotate(-10,60,490)">🌼</text>
  <text x="200" y="480" font-size="42" opacity=".09" transform="rotate(15,200,480)">🌷</text>

  <!-- Small flowers scattered -->
  <text x="30" y="140" font-size="16" opacity=".3">🌸</text>
  <text x="250" y="120" font-size="14" opacity=".28">🌷</text>
  <text x="20" y="380" font-size="15" opacity=".25">🌺</text>
  <text x="255" y="400" font-size="14" opacity=".28">🌼</text>

  <!-- Header -->
  <text x="150" y="38" text-anchor="middle" font-size="8" fill="#ec4899" letter-spacing="2" font-family="sans-serif">🌸 FLORAL WEDDING 🌸</text>

  <!-- Photo round frame -->
  <circle cx="150" cy="125" r="70" fill="#fce7f3" stroke="#f9a8d4" stroke-width="2"/>
  <circle cx="150" cy="125" r="62" fill="#fdf2f8"/>
  <ellipse cx="150" cy="148" rx="30" ry="36" fill="#f9a8d4" opacity=".35"/>
  <circle cx="150" cy="112" r="22" fill="#f9a8d4" opacity=".35"/>

  <!-- Flower wreath dots -->
  <circle cx="150" cy="57" r="3" fill="#f472b6" opacity=".5"/>
  <circle cx="197" cy="72" r="3" fill="#f472b6" opacity=".45"/>
  <circle cx="216" cy="118" r="3" fill="#f472b6" opacity=".4"/>
  <circle cx="103" cy="72" r="3" fill="#f472b6" opacity=".45"/>
  <circle cx="84" cy="118" r="3" fill="#f472b6" opacity=".4"/>

  <!-- Names -->
  <text x="150" y="220" text-anchor="middle" font-size="18" fill="#be185d" font-family="Georgia,serif" font-style="italic">Siti &amp; Ahmad</text>
  <text x="150" y="238" text-anchor="middle" font-size="8" fill="#f472b6" letter-spacing="2">Sabtu, 14 Maret 2026</text>

  <!-- Floral divider -->
  <text x="150" y="258" text-anchor="middle" font-size="11" fill="#f9a8d4" letter-spacing="6">✿✿✿</text>

  <!-- Event cards round corners -->
  <rect x="28" y="268" width="115" height="80" rx="12" fill="white" opacity=".85"/>
  <circle cx="85" cy="288" r="10" fill="#f472b6" opacity=".25"/>
  <text x="85" y="292" text-anchor="middle" font-size="10" fill="#ec4899">🌸</text>
  <text x="85" y="310" text-anchor="middle" font-size="8" fill="#be185d" font-family="Georgia,serif">Akad Nikah</text>
  <text x="85" y="324" text-anchor="middle" font-size="7" fill="#9d174d" opacity=".6">08.00 WIB</text>
  <text x="85" y="337" text-anchor="middle" font-size="6.5" fill="#f472b6" opacity=".7">Grand Ballroom</text>

  <rect x="157" y="268" width="115" height="80" rx="12" fill="white" opacity=".85"/>
  <circle cx="215" cy="288" r="10" fill="#f472b6" opacity=".25"/>
  <text x="215" y="292" text-anchor="middle" font-size="10" fill="#ec4899">🌺</text>
  <text x="215" y="310" text-anchor="middle" font-size="8" fill="#be185d" font-family="Georgia,serif">Resepsi</text>
  <text x="215" y="324" text-anchor="middle" font-size="7" fill="#9d174d" opacity=".6">11.00 WIB</text>
  <text x="215" y="337" text-anchor="middle" font-size="6.5" fill="#f472b6" opacity=".7">Hotel Mulia</text>

  <!-- Gallery peek -->
  <rect x="28" y="360" width="60" height="52" rx="8" fill="#fce7f3"/>
  <rect x="95" y="360" width="60" height="52" rx="8" fill="#fdf2f8"/>
  <rect x="162" y="360" width="60" height="52" rx="8" fill="#fce7f3"/>
  <rect x="229" y="360" width="43" height="52" rx="8" fill="#fdf2f8"/>
  <text x="58" y="390" text-anchor="middle" font-size="20" opacity=".2">🌸</text>
  <text x="125" y="390" text-anchor="middle" font-size="20" opacity=".2">🌷</text>
  <text x="192" y="390" text-anchor="middle" font-size="20" opacity=".2">🌺</text>
  <text x="250" y="390" text-anchor="middle" font-size="18" opacity=".2">🌼</text>

  <!-- RSVP -->
  <rect x="70" y="424" width="160" height="26" rx="13" fill="url(#pink)"/>
  <text x="150" y="441" text-anchor="middle" font-size="9" fill="white" font-family="sans-serif">Konfirmasi Hadir 🌸</text>

  <text x="150" y="484" text-anchor="middle" font-size="7" fill="#f9a8d4" letter-spacing="3" opacity=".7">FLORAL · ROMANTIC WEDDING</text>
</svg>
