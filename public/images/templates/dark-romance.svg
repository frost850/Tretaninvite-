<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="300" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0005"/>
      <stop offset="50%" stop-color="#180010"/>
      <stop offset="100%" stop-color="#0a0005"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>
  <rect width="300" height="500" fill="url(#bg)" rx="16"/>

  <!-- Red glow center -->
  <ellipse cx="150" cy="180" rx="120" ry="160" fill="#dc2626" opacity=".04"/>

  <!-- Rose petals deco -->
  <text x="14" y="68" font-size="22" opacity=".35" transform="rotate(-20,14,68)">🌹</text>
  <text x="256" y="44" font-size="18" opacity=".3" transform="rotate(15,256,44)">🌹</text>
  <text x="10" y="360" font-size="20" opacity=".28" transform="rotate(-12,10,360)">🌹</text>
  <text x="255" y="400" font-size="18" opacity=".3" transform="rotate(18,255,400)">🌹</text>

  <!-- Thin red decorative lines -->
  <rect x="40" y="46" width="220" height=".7" fill="url(#red)" opacity=".6"/>
  <rect x="40" y="464" width="220" height=".7" fill="url(#red)" opacity=".6"/>

  <!-- Header -->
  <text x="150" y="40" text-anchor="middle" font-size="7.5" fill="#dc2626" letter-spacing="3" font-family="Georgia,serif">🌹 DARK ROMANCE 🌹</text>

  <!-- Dramatic photo frame -->
  <rect x="60" y="56" width="180" height="190" rx="6" fill="#1a0010" stroke="#7f1d1d" stroke-width="1.5"/>
  <rect x="64" y="60" width="172" height="182" rx="4" fill="#0f000a"/>
  <!-- Red vignette on corners -->
  <rect x="60" y="56" width="180" height="190" rx="6" fill="none" stroke="#dc2626" stroke-width=".4" opacity=".3"/>
  <!-- Silhouette dark -->
  <ellipse cx="150" cy="200" rx="42" ry="46" fill="#1a0010"/>
  <circle cx="150" cy="154" r="30" fill="#1a0010"/>
  <!-- Rose overlay -->
  <text x="150" y="185" text-anchor="middle" font-size="38" fill="#7f1d1d" opacity=".12">🌹</text>

  <!-- Corner rose ornament -->
  <text x="66" y="78" font-size="12" fill="#dc2626" opacity=".5">✦</text>
  <text x="222" y="78" font-size="12" fill="#dc2626" opacity=".5">✦</text>
  <text x="66" y="242" font-size="12" fill="#dc2626" opacity=".5">✦</text>
  <text x="222" y="242" font-size="12" fill="#dc2626" opacity=".5">✦</text>

  <!-- Names -->
  <text x="150" y="276" text-anchor="middle" font-size="11" fill="#dc2626" font-family="Georgia,serif" font-style="italic">Siti Nurhaliza</text>
  <rect x="108" y="280" width="84" height=".7" fill="url(#red)" opacity=".5"/>
  <text x="150" y="294" text-anchor="middle" font-size="14" fill="#991b1b" font-family="Georgia,serif">&amp;</text>
  <rect x="108" y="297" width="84" height=".7" fill="url(#red)" opacity=".5"/>
  <text x="150" y="310" text-anchor="middle" font-size="11" fill="#dc2626" font-family="Georgia,serif" font-style="italic">Ahmad Dhani</text>
  <text x="150" y="324" text-anchor="middle" font-size="7" fill="#7f1d1d" letter-spacing="3">SABTU, 14 MARET 2026</text>

  <!-- Event cards dark-red -->
  <rect x="30" y="340" width="115" height="74" rx="3" fill="#0f000a" stroke="#7f1d1d" stroke-width=".8"/>
  <text x="87" y="360" text-anchor="middle" font-size="12" fill="#dc2626">🌹</text>
  <text x="87" y="378" text-anchor="middle" font-size="7.5" fill="#dc2626" font-family="Georgia,serif">Akad Nikah</text>
  <text x="87" y="392" text-anchor="middle" font-size="7" fill="#991b1b">08.00 WIB</text>
  <text x="87" y="404" text-anchor="middle" font-size="6.5" fill="#7f1d1d">Grand Ballroom</text>

  <rect x="155" y="340" width="115" height="74" rx="3" fill="#0f000a" stroke="#7f1d1d" stroke-width=".8"/>
  <text x="212" y="360" text-anchor="middle" font-size="12" fill="#dc2626">🥀</text>
  <text x="212" y="378" text-anchor="middle" font-size="7.5" fill="#dc2626" font-family="Georgia,serif">Resepsi</text>
  <text x="212" y="392" text-anchor="middle" font-size="7" fill="#991b1b">11.00 WIB</text>
  <text x="212" y="404" text-anchor="middle" font-size="6.5" fill="#7f1d1d">Hotel Mulia</text>

  <!-- RSVP dark red -->
  <rect x="70" y="428" width="160" height="26" rx="3" fill="none" stroke="#dc2626" stroke-width="1"/>
  <text x="150" y="445" text-anchor="middle" font-size="9" fill="#dc2626" font-family="Georgia,serif" letter-spacing="1">KONFIRMASI HADIR</text>

  <text x="150" y="480" text-anchor="middle" font-size="7" fill="#7f1d1d" letter-spacing="3" opacity=".7">DARK ROMANCE · WEDDING</text>
</svg>
