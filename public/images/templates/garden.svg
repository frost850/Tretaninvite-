  <rect x="95" y="372" width="60" height="52" rx="8" fill="#dcfce7"/>
  <rect x="162" y="372" width="60" height="52" rx="8" fill="#bbf7d0"/>
  <rect x="229" y="372" width="43" height="52" rx="8" fill="#dcfce7"/>
  <text x="58" y="401" text-anchor="middle" font-size="18" opacity=".25">🌿</text>
