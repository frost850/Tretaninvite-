  <text x="85" y="330" text-anchor="middle" font-size="7" fill="#166534" opacity=".65">08.00 WIB</text>
  <text x="85" y="343" text-anchor="middle" font-size="6.5" fill="#22c55e" opacity=".7">Taman Resepsi</text>
  <text x="85" y="354" text-anchor="middle" font-size="6" fill="#166534" opacity=".5">Kebun Raya Bogor</text>

  <rect x="157" y="276" width="115" height="84" rx="10" fill="white" opacity=".85" stroke="#86efac" stroke-width=".8"/>
