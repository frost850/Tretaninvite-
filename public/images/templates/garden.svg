  </defs>
  <rect width="300" height="500" fill="url(#bg)" rx="16"/>

  <!-- Leaf deco bg -->
  <text x="-5" y="80" font-size="52" opacity=".07" transform="rotate(-25,-5,80)">🌿</text>
  <text x="230" y="50" font-size="48" opacity=".07" transform="rotate(20,230,50)">🍃</text>
  <text x="-10" y="330" font-size="56" opacity=".06" transform="rotate(-15,-10,330)">🌿</text>
  <text x="240" y="440" font-size="44" opacity=".07" transform="rotate(18,240,440)">🍃</text>

