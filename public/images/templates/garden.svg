  <text x="215" y="316" text-anchor="middle" font-size="8" fill="#15803d" font-family="Georgia,serif">Resepsi</text>
  <text x="215" y="330" text-anchor="middle" font-size="7" fill="#166534" opacity=".65">11.00 WIB</text>
  <text x="215" y="343" text-anchor="middle" font-size="6.5" fill="#22c55e" opacity=".7">Taman Resepsi</text>
  <text x="215" y="354" text-anchor="middle" font-size="6" fill="#166534" opacity=".5">Hotel Mulia</text>

