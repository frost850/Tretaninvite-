<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafaf9"/>
      <stop offset="100%" stop-color="#f5f5f4"/>
    </linearGradient>
    <linearGradient id="photoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7e5e4"/>
      <stop offset="100%" stop-color="#f5f5f4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" fill="url(#bg)"/>

  <!-- Ultra-thin border -->
  <rect x="12" y="12" width="376" height="536" fill="none" stroke="#78716c" stroke-width=".6" opacity=".35"/>
  <rect x="20" y="20" width="360" height="520" fill="none" stroke="#78716c" stroke-width=".3" opacity=".2"/>

  <!-- Header — ultra minimal -->
  <text x="200" y="55" font-family="Georgia,serif" font-size="8" letter-spacing="6" fill="#57534e" text-anchor="middle">UNDANGAN WISUDA</text>
  <line x1="80" y1="63" x2="320" y2="63" stroke="#78716c" stroke-width=".5" opacity=".4"/>

  <!-- Photo — minimal circle -->
  <circle cx="200" cy="182" r="72" fill="url(#photoGrad)" stroke="#78716c" stroke-width="1" opacity=".6"/>
  <circle cx="200" cy="182" r="64" fill="none" stroke="#78716c" stroke-width=".4" opacity=".3"/>
  <!-- Silhouette -->
  <ellipse cx="200" cy="164" rx="22" ry="26" fill="#78716c" opacity=".18"/>
  <ellipse cx="200" cy="206" rx="35" ry="22" fill="#78716c" opacity=".12"/>
  <!-- Cap minimal -->
  <g transform="translate(200,112)">
    <polygon points="-20,0 0,-11 20,0 0,11" fill="#44403c" opacity=".85"/>
    <rect x="-10" y="-13" width="20" height="14" rx="2" fill="#57534e" opacity=".85"/>
    <line x1="20" y1="0" x2="20" y2="16" stroke="#a8a29e" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="2.5" fill="#a8a29e"/>
  </g>

  <!-- Rule divider top -->
  <line x1="80" y1="276" x2="175" y2="276" stroke="#78716c" stroke-width=".5" opacity=".4"/>
  <ellipse cx="200" cy="276" rx="4" ry="4" fill="none" stroke="#78716c" stroke-width=".6" opacity=".5"/>
  <line x1="225" y1="276" x2="320" y2="276" stroke="#78716c" stroke-width=".5" opacity=".4"/>

  <!-- Name -->
  <text x="200" y="300" font-family="Georgia,serif" font-size="22" fill="#1c1917" text-anchor="middle" letter-spacing=".3">Nama Wisudawan</text>
  <text x="200" y="318" font-family="Arial,sans-serif" font-size="8" fill="#78716c" text-anchor="middle" letter-spacing="3">WISUDAWAN</text>

  <!-- Rule divider bottom -->
  <line x1="80" y1="330" x2="175" y2="330" stroke="#78716c" stroke-width=".5" opacity=".4"/>
  <ellipse cx="200" cy="330" rx="4" ry="4" fill="none" stroke="#78716c" stroke-width=".6" opacity=".5"/>
  <line x1="225" y1="330" x2="320" y2="330" stroke="#78716c" stroke-width=".5" opacity=".4"/>

  <!-- University -->
  <text x="200" y="354" font-family="Georgia,serif" font-size="9" font-style="italic" fill="#57534e" text-anchor="middle">Universitas · Program Studi</text>
  <text x="200" y="370" font-family="Arial,sans-serif" font-size="8" fill="#a8a29e" text-anchor="middle">IPK : 3.90</text>

  <!-- Event info minimal -->
  <line x1="60" y1="394" x2="340" y2="394" stroke="#78716c" stroke-width=".4" opacity=".3"/>
  <text x="200" y="415" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#44403c" text-anchor="middle" letter-spacing="1">PROSESI WISUDA</text>
  <text x="200" y="431" font-family="Georgia,serif" font-size="9" font-style="italic" fill="#78716c" text-anchor="middle">Senin, 4 Maret 2026 · 08.00 WIB</text>
  <text x="200" y="447" font-family="Arial,sans-serif" font-size="8" fill="#a8a29e" text-anchor="middle">Gedung Wisuda Universitas</text>
  <line x1="60" y1="460" x2="340" y2="460" stroke="#78716c" stroke-width=".4" opacity=".3"/>

  <!-- WA Button minimal -->
  <rect x="110" y="476" width="180" height="28" rx="2" fill="none" stroke="#57534e" stroke-width=".8"/>
  <text x="200" y="494" font-family="Arial,sans-serif" font-size="8" fill="#57534e" text-anchor="middle" letter-spacing="1">Kirim Ucapan via WhatsApp</text>

  <!-- Bottom tag -->
  <text x="200" y="534" font-family="Georgia,serif" font-size="8" fill="#a8a29e" text-anchor="middle" font-style="italic">graduation · minimal · berkelas</text>
</svg>
