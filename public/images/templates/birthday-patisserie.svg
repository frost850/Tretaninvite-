<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="300" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f8"/>
      <stop offset="50%" stop-color="#f5eeff"/>
      <stop offset="100%" stop-color="#fce4ec"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="300" height="500" fill="url(#bg)" rx="16"/>

  <!-- Floral deco -->
  <text x="10" y="64" font-size="22" opacity=".25" transform="rotate(-18,10,64)">🌸</text>
  <text x="255" y="42" font-size="18" opacity=".22" transform="rotate(20,255,42)">🌷</text>
  <text x="8" y="330" font-size="20" opacity=".2" transform="rotate(-14,8,330)">🌺</text>
  <text x="258" y="400" font-size="18" opacity=".22" transform="rotate(16,258,400)">🌼</text>

