  <text x="150" y="36" text-anchor="middle" font-size="8" fill="#a78bfa" letter-spacing="2">🍰 Birthday Patisserie 🍰</text>
  <rect x="70" y="40" width="160" height=".7" fill="url(#rose)" opacity=".4"/>

  <!-- Tea-party table illustration -->
  <!-- Table surface -->
  <ellipse cx="150" cy="186" rx="100" ry="14" fill="#fce4ec" opacity=".7"/>
  <!-- Tablecloth lace edge -->
  <path d="M50,186 Q58,178 66,186 Q74,178 82,186 Q90,178 98,186 Q106,178 114,186 Q122,178 130,186 Q138,178 146,186 Q154,178 162,186 Q170,178 178,186 Q186,178 194,186 Q202,178 210,186 Q218,178 226,186 Q234,178 242,186 Q250,178 250,186" fill="none" stroke="#f9a8d4" stroke-width="1" opacity=".8"/>
  <!-- Teapot -->
  <ellipse cx="105" cy="162" rx="28" ry="22" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1"/>
  <path d="M130,158 Q142,153 138,162" fill="none" stroke="#f9a8d4" stroke-width="1.5"/>
  <rect x="96" y="140" width="18" height="6" rx="3" fill="#f9a8d4" opacity=".7"/>
  <ellipse cx="105" cy="162" rx="28" ry="22" fill="none" stroke="#c084fc" stroke-width=".5" opacity=".4"/>
  <!-- Teacup -->
  <path d="M140,170 Q140,184 160,184 Q180,184 180,170 Z" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1"/>
  <ellipse cx="160" cy="170" rx="20" ry="6" fill="#fce4ec"/>
  <path d="M178,174 Q186,174 186,178 Q186,182 178,182" fill="none" stroke="#f9a8d4" stroke-width="1.2"/>
  <rect x="140" y="184" width="40" height="3" rx="1.5" fill="#fce7f3"/>
  <!-- Cake slice -->
  <path d="M192,168 L210,138 L228,168 Z" fill="#fbcfe8"/>
  <rect x="192" y="168" width="36" height="8" rx="1" fill="#fde68a"/>
  <!-- Candle on cake -->
  <rect x="208" y="127" width="4" height="12" rx="2" fill="#c084fc"/>
  <ellipse cx="210" cy="125" rx="3" ry="3.5" fill="#fbbf24" opacity=".85"/>

  <!-- Name elegant -->
  <text x="150" y="218" text-anchor="middle" font-size="15" fill="#be185d" font-family="Georgia,serif" font-style="italic">Aisyah Azzahra</text>
  <rect x="85" y="223" width="130" height=".8" fill="url(#rose)" opacity=".5"/>
  <text x="150" y="237" text-anchor="middle" font-size="8.5" fill="#a78bfa" font-family="Georgia,serif" font-style="italic">Ulang Tahun ke-7 ✨</text>
  <text x="150" y="252" text-anchor="middle" font-size="7.5" fill="#c084fc" letter-spacing="1">Sabtu, 14 Maret 2026</text>

  <!-- Floral divider -->
