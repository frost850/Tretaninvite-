  <rect x="28" y="280" width="115" height="68" rx="10" fill="white" opacity=".8" stroke="#f9a8d4" stroke-width=".7"/>
  <text x="85" y="302" text-anchor="middle" font-size="14" fill="#f472b6">📍</text>
  <text x="85" y="320" text-anchor="middle" font-size="8" fill="#be185d" font-family="Georgia,serif">Lokasi</text>
  <text x="85" y="334" text-anchor="middle" font-size="7" fill="#be185d" opacity=".6">Taman Ancol</text>
  <text x="85" y="344" text-anchor="middle" font-size="6.5" fill="#a78bfa">Jakarta Utara</text>

  <rect x="157" y="280" width="115" height="68" rx="10" fill="white" opacity=".8" stroke="#c4b5fd" stroke-width=".7"/>
  <text x="214" y="302" text-anchor="middle" font-size="14" fill="#a78bfa">⏰</text>
  <text x="214" y="320" text-anchor="middle" font-size="8" fill="#7c3aed" font-family="Georgia,serif">Waktu</text>
  <text x="214" y="334" text-anchor="middle" font-size="7" fill="#7c3aed" opacity=".65">14:00 WIB</text>
  <text x="214" y="344" text-anchor="middle" font-size="6.5" fill="#c084fc">Casual Colorful</text>

  <!-- Theme pill -->
  <rect x="75" y="360" width="150" height="20" rx="10" fill="url(#rose)" opacity=".2" stroke="#f9a8d4" stroke-width=".7"/>
  <text x="150" y="374" text-anchor="middle" font-size="8" fill="#be185d">🦋 Princess &amp; Butterfly Theme</text>

  <!-- Macaroon row — color dots as macaroons -->
  <circle cx="60" cy="408" r="16" fill="#f9a8d4" opacity=".7"/>
  <circle cx="60" cy="408" r="10" fill="#fce7f3" opacity=".8"/>
  <circle cx="108" cy="408" r="16" fill="#a5f3fc" opacity=".6"/>
  <circle cx="108" cy="408" r="10" fill="#e0f2fe" opacity=".8"/>
  <circle cx="156" cy="408" r="16" fill="#c4b5fd" opacity=".65"/>
  <circle cx="156" cy="408" r="10" fill="#f5f3ff" opacity=".8"/>
  <circle cx="204" cy="408" r="16" fill="#fde68a" opacity=".65"/>
  <circle cx="204" cy="408" r="10" fill="#fef9c3" opacity=".8"/>
  <circle cx="250" cy="408" r="16" fill="#86efac" opacity=".6"/>
  <circle cx="250" cy="408" r="10" fill="#dcfce7" opacity=".8"/>

  <!-- RSVP -->
  <rect x="70" y="436" width="160" height="26" rx="13" fill="url(#rose)"/>
  <text x="150" y="453" text-anchor="middle" font-size="9" fill="white">Konfirmasi Hadir 🎂</text>

  <text x="150" y="484" text-anchor="middle" font-size="7" fill="#c084fc" letter-spacing="2" opacity=".7">BIRTHDAY PATISSERIE · TEA PARTY</text>
