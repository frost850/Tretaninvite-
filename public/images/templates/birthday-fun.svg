  <ellipse cx="110" cy="388" rx="22" ry="28" fill="#93c5fd" opacity=".55"/>
  <line x1="110" y1="416" x2="110" y2="445" stroke="#93c5fd" stroke-width="1.2" opacity=".5"/>
