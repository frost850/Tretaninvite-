<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:transparent"/>
      <stop offset="50%" style="stop-color:#c9a84c"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:transparent"/>
      <stop offset="50%" style="stop-color:#c9a84c"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:rgba(201,168,76,0.06)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
    <!-- Chevron pattern -->
    <pattern id="chev" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="10" y2="10" stroke="rgba(201,168,76,0.04)" stroke-width="1"/>
      <line x1="10" y1="0" x2="0" y2="10" stroke="rgba(201,168,76,0.04)" stroke-width="1"/>
      <line x1="10" y1="10" x2="20" y2="20" stroke="rgba(201,168,76,0.04)" stroke-width="1"/>
      <line x1="20" y1="10" x2="10" y2="20" stroke="rgba(201,168,76,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="280" fill="url(#bg)"/>
  <rect width="400" height="280" fill="url(#chev)"/>
  <rect width="400" height="280" fill="url(#glow)"/>
  
  <!-- Outer frame -->
  <rect x="8" y="8" width="384" height="264" fill="none" stroke="rgba(201,168,76,0.18)" stroke-width="1"/>
  <rect x="14" y="14" width="372" height="252" fill="none" stroke="rgba(201,168,76,0.07)" stroke-width="1"/>

  <!-- Corner ornaments TL -->
  <line x1="8" y1="8" x2="48" y2="8" stroke="#c9a84c" stroke-width="1.2"/>
  <line x1="8" y1="8" x2="8" y2="48" stroke="#c9a84c" stroke-width="1.2"/>
  <polygon points="38,8 48,18 38,28 28,18" fill="none" stroke="rgba(201,168,76,0.3)" stroke-width="0.8"/>
  <!-- TR -->
  <line x1="392" y1="8" x2="352" y2="8" stroke="#c9a84c" stroke-width="1.2"/>
  <line x1="392" y1="8" x2="392" y2="48" stroke="#c9a84c" stroke-width="1.2"/>
  <polygon points="362,8 352,18 362,28 372,18" fill="none" stroke="rgba(201,168,76,0.3)" stroke-width="0.8"/>
  <!-- BL -->
  <line x1="8" y1="272" x2="48" y2="272" stroke="#c9a84c" stroke-width="1.2"/>
  <line x1="8" y1="272" x2="8" y2="232" stroke="#c9a84c" stroke-width="1.2"/>
  <!-- BR -->
  <line x1="392" y1="272" x2="352" y2="272" stroke="#c9a84c" stroke-width="1.2"/>
  <line x1="392" y1="272" x2="392" y2="232" stroke="#c9a84c" stroke-width="1.2"/>

  <!-- Art Deco top ornament -->
  <line x1="100" y1="62" x2="300" y2="62" stroke="rgba(201,168,76,0.2)" stroke-width="0.8"/>
  <line x1="100" y1="58" x2="300" y2="58" stroke="rgba(201,168,76,0.07)" stroke-width="0.8"/>
  <polygon points="200,44 208,60 200,76 192,60" fill="rgba(201,168,76,0.15)" stroke="rgba(201,168,76,0.45)" stroke-width="0.7"/>
  <polygon points="200,50 205,60 200,70 195,60" fill="rgba(201,168,76,0.08)"/>
  <polygon points="164,62 172,55 180,62 172,69" fill="none" stroke="rgba(201,168,76,0.32)" stroke-width="0.8"/>
  <polygon points="236,62 228,55 220,62 228,69" fill="none" stroke="rgba(201,168,76,0.32)" stroke-width="0.8"/>
  <circle cx="200" cy="62" r="4" fill="rgba(201,168,76,0.55)"/>
  <circle cx="172" cy="62" r="2" fill="rgba(201,168,76,0.3)"/>
  <circle cx="228" cy="62" r="2" fill="rgba(201,168,76,0.3)"/>
  <line x1="200" y1="44" x2="140" y2="60" stroke="rgba(201,168,76,0.1)" stroke-width="0.5"/>
  <line x1="200" y1="44" x2="260" y2="60" stroke="rgba(201,168,76,0.1)" stroke-width="0.5"/>

  <!-- "PROUDLY PRESENTS" label -->
  <text x="200" y="95" text-anchor="middle" font-family="'Josefin Sans',sans-serif" font-size="7" font-weight="200" fill="rgba(201,168,76,0.5)" letter-spacing="5">PROUDLY PRESENTS</text>

  <!-- "An Evening with" italic -->
  <text x="200" y="113" text-anchor="middle" font-family="serif" font-size="10" font-style="italic" fill="rgba(170,170,170,0.7)" letter-spacing="2">An Evening with</text>

  <!-- Main name -->
  <text x="200" y="148" text-anchor="middle" font-family="serif" font-size="38" font-weight="700" font-style="italic" fill="#f5f5f0" letter-spacing="1.5">Birthday</text>
  
  <!-- Underline flourish -->
  <rect x="110" y="151" width="180" height="0.8" fill="url(#gold)"/>

  <!-- Gold rule + roman numeral -->
  <line x1="80" y1="165" x2="300" y2="165" stroke="url(#gold)" stroke-width="0.5"/>
  <polygon points="193,165 197,170 200,165 197,160" fill="rgba(201,168,76,0.5)"/>
  <polygon points="200,165 203,170 207,165 203,160" fill="rgba(201,168,76,0.8)"/>
  <polygon points="207,165 211,170 215,165 211,160" fill="rgba(201,168,76,0.5)"/>
  
  <!-- Roman numeral / age -->
  <text x="200" y="183" text-anchor="middle" font-family="serif" font-size="14" font-style="italic" fill="#c9a84c" letter-spacing="6" opacity="0.9">XXV</text>

  <!-- Bottom horizontal rule -->
  <line x1="80" y1="195" x2="300" y2="195" stroke="url(#gold)" stroke-width="0.5"/>

  <!-- Date/venue info -->
  <text x="200" y="214" text-anchor="middle" font-family="'Josefin Sans',sans-serif" font-size="8" font-weight="200" fill="rgba(170,170,170,0.65)" letter-spacing="3">THE GRAND SOIREE</text>
  
  <!-- Art Deco bottom ornament -->
  <line x1="140" y1="232" x2="165" y2="232" stroke="rgba(201,168,76,0.35)" stroke-width="0.8"/>
  <polygon points="200,225 204,232 200,239 196,232" fill="rgba(201,168,76,0.5)"/>
  <circle cx="200" cy="232" r="2.5" fill="rgba(201,168,76,0.4)"/>
  <line x1="235" y1="232" x2="260" y2="232" stroke="rgba(201,168,76,0.35)" stroke-width="0.8"/>
  
  <!-- Film circle decorations bottom -->
  <circle cx="160" cy="258" r="9" fill="none" stroke="rgba(201,168,76,0.18)" stroke-width="0.8"/>
  <text x="160" y="262" text-anchor="middle" font-family="sans-serif" font-size="6" fill="rgba(201,168,76,0.4)">IV</text>
  <circle cx="180" cy="258" r="9" fill="none" stroke="rgba(201,168,76,0.18)" stroke-width="0.8"/>
  <text x="180" y="262" text-anchor="middle" font-family="sans-serif" font-size="6" fill="rgba(201,168,76,0.4)">III</text>
  <circle cx="200" cy="258" r="9" fill="none" stroke="rgba(201,168,76,0.5)" stroke-width="1"/>
  <text x="200" y="262" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#c9a84c">II</text>
  <circle cx="220" cy="258" r="9" fill="none" stroke="rgba(201,168,76,0.18)" stroke-width="0.8"/>
  <text x="220" y="262" text-anchor="middle" font-family="sans-serif" font-size="6" fill="rgba(201,168,76,0.4)">I</text>
  <circle cx="240" cy="258" r="9" fill="none" stroke="rgba(201,168,76,0.18)" stroke-width="0.8"/>
  <text x="240" y="262" text-anchor="middle" font-family="sans-serif" font-size="6" fill="rgba(201,168,76,0.4)">V</text>
</svg>
