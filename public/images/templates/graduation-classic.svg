<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fefbe9"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a36e30"/>
      <stop offset="100%" stop-color="#d4a032"/>
    </linearGradient>
    <linearGradient id="photoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fefbe9"/>
    </linearGradient>
  </defs>

  <!-- Background parchment -->
  <rect width="400" height="560" fill="url(#bg)"/>

  <!-- Ornate double border -->
  <rect x="8" y="8" width="384" height="544" fill="none" stroke="#a36e30" stroke-width="1.5" opacity=".6"/>
  <rect x="16" y="16" width="368" height="528" fill="none" stroke="#d4a032" stroke-width=".5" stroke-dasharray="4 2" opacity=".4"/>

  <!-- Corner SVG ornaments (dashed lines) -->
  <path d="M8,8 L8,50 M8,8 L50,8" stroke="#a36e30" stroke-width=".8" opacity=".5" stroke-dasharray="3 2"/>
  <path d="M392,8 L392,50 M392,8 L350,8" stroke="#a36e30" stroke-width=".8" opacity=".5" stroke-dasharray="3 2"/>
  <path d="M8,552 L8,510 M8,552 L50,552" stroke="#a36e30" stroke-width=".8" opacity=".5" stroke-dasharray="3 2"/>
  <path d="M392,552 L392,510 M392,552 L350,552" stroke="#a36e30" stroke-width=".8" opacity=".5" stroke-dasharray="3 2"/>
  <circle cx="8" cy="8" r="3" fill="#a36e30" opacity=".5"/>
  <circle cx="392" cy="8" r="3" fill="#a36e30" opacity=".5"/>
  <circle cx="8" cy="552" r="3" fill="#a36e30" opacity=".5"/>
  <circle cx="392" cy="552" r="3" fill="#a36e30" opacity=".5"/>

  <!-- Petals scattered -->
  <circle cx="55" cy="90" r="6" fill="#d4a032" opacity=".1"/>
  <circle cx="335" cy="120" r="5" fill="#a36e30" opacity=".1"/>
  <circle cx="45" cy="360" r="4" fill="#d4a032" opacity=".08"/>
  <circle cx="355" cy="400" r="5" fill="#a36e30" opacity=".08"/>

  <!-- Header -->
  <text x="200" y="55" font-family="Georgia,serif" font-size="8" letter-spacing="5" fill="#a36e30" text-anchor="middle">UNDANGAN WISUDA</text>

  <!-- Ornament divider top -->
  <line x1="60" y1="63" x2="170" y2="63" stroke="#a36e30" stroke-width=".8" opacity=".5"/>
  <text x="200" y="69" font-size="10" fill="#a36e30" text-anchor="middle">◆</text>
  <line x1="230" y1="63" x2="340" y2="63" stroke="#a36e30" stroke-width=".8" opacity=".5"/>

  <!-- Photo frame - classic ellipse with petals container -->
  <ellipse cx="200" cy="188" rx="72" ry="88" fill="url(#photoGrad)" stroke="#a36e30" stroke-width="2" opacity=".6"/>
  <ellipse cx="200" cy="188" rx="64" ry="80" fill="none" stroke="#d4a032" stroke-width=".5" opacity=".4"/>
  <!-- Silhouette -->
  <ellipse cx="200" cy="170" rx="24" ry="28" fill="#a36e30" opacity=".18"/>
  <ellipse cx="200" cy="214" rx="40" ry="26" fill="#a36e30" opacity=".12"/>
  <!-- Cap classic -->
  <g transform="translate(200,114)">
    <polygon points="-26,0 0,-14 26,0 0,14" fill="#6b3f0a" opacity=".9"/>
    <rect x="-13" y="-16" width="26" height="18" rx="2" fill="#854d0e" opacity=".9"/>
    <line x1="26" y1="0" x2="26" y2="22" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="26" cy="25" r="3.5" fill="#fbbf24"/>
  </g>

  <!-- Name classic -->
  <text x="200" y="305" font-family="Georgia,serif" font-size="20" font-weight="600" fill="#6b3f0a" text-anchor="middle" letter-spacing=".5">Nama Wisudawan</text>
  <text x="200" y="323" font-family="Georgia,serif" font-size="9" font-style="italic" fill="#a36e30" text-anchor="middle" letter-spacing="2">Wisudawan</text>

  <!-- Ornament line divider -->
  <line x1="60" y1="337" x2="175" y2="337" stroke="#a36e30" stroke-width=".8" opacity=".5"/>
  <text x="200" y="343" font-size="10" fill="#a36e30" text-anchor="middle">◈</text>
  <line x1="225" y1="337" x2="340" y2="337" stroke="#a36e30" stroke-width=".8" opacity=".5"/>

  <!-- University info -->
  <text x="200" y="362" font-family="Georgia,serif" font-size="9" font-style="italic" fill="#854d0e" text-anchor="middle">Universitas · Program Studi</text>
  <text x="200" y="378" font-family="Arial,sans-serif" font-size="8" fill="#d4a032" text-anchor="middle">IPK : 3.90</text>

  <!-- Event card classic -->
  <rect x="60" y="394" width="280" height="80" rx="3" fill="rgba(163,110,48,0.06)" stroke="#a36e30" stroke-width=".8" opacity=".4"/>
  <text x="86" y="421" font-size="16">🎓</text>
  <text x="114" y="420" font-family="Georgia,serif" font-size="9" font-weight="700" fill="#6b3f0a" letter-spacing="1">PROSESI WISUDA</text>
  <text x="114" y="436" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#a36e30">Senin, 4 Maret 2026</text>
  <text x="114" y="451" font-family="Arial,sans-serif" font-size="7.5" fill="#d4a032" opacity=".8">Gedung Wisuda · 08.00 WIB</text>

  <!-- WA Button classic -->
  <rect x="80" y="486" width="240" height="32" rx="2" fill="none" stroke="#a36e30" stroke-width="1.2"/>
  <text x="200" y="507" font-family="Georgia,serif" font-size="8.5" fill="#6b3f0a" text-anchor="middle" letter-spacing=".5">Kirim Ucapan via WhatsApp</text>

  <!-- Bottom ornament -->
  <line x1="80" y1="528" x2="175" y2="528" stroke="#a36e30" stroke-width=".6" opacity=".4"/>
  <text x="200" y="534" font-size="9" fill="#a36e30" text-anchor="middle">◆</text>
  <line x1="225" y1="528" x2="320" y2="528" stroke="#a36e30" stroke-width=".6" opacity=".4"/>
</svg>
