<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="300" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1a2e"/>
      <stop offset="100%" stop-color="#1a112b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9963a"/>
      <stop offset="50%" stop-color="#f5d98b"/>
      <stop offset="100%" stop-color="#c9963a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="300" height="500" fill="url(#bg)" rx="16"/>

  <!-- Star particles -->
  <circle cx="40" cy="60" r="1" fill="#f5d98b" opacity=".6"/>
  <circle cx="80" cy="30" r="1.5" fill="#f5d98b" opacity=".8"/>
  <circle cx="220" cy="50" r="1" fill="#f5d98b" opacity=".5"/>
  <circle cx="260" cy="80" r="1.2" fill="#f5d98b" opacity=".7"/>
  <circle cx="150" cy="20" r="1" fill="#f5d98b" opacity=".6"/>
  <circle cx="30" cy="180" r="1" fill="#c9963a" opacity=".4"/>
  <circle cx="270" cy="150" r="1.2" fill="#c9963a" opacity=".5"/>

  <!-- Top ornament line -->
  <rect x="60" y="50" width="180" height="1" fill="url(#gold)" opacity=".6"/>
  <text x="150" y="45" text-anchor="middle" font-size="12" fill="#c9963a" font-family="Georgia,serif">♛ VIP ROYAL ♛</text>

  <!-- Couple photo frame (simulated) -->
  <rect x="75" y="65" width="150" height="160" rx="4" fill="#162040" stroke="#c9963a" stroke-width="1.5"/>
  <rect x="82" y="72" width="136" height="146" rx="2" fill="#0d1728"/>
  <!-- silhouette -->
  <ellipse cx="150" cy="148" rx="34" ry="48" fill="#1e2e50"/>
  <circle cx="150" cy="110" r="24" fill="#1e2e50"/>
  <text x="150" y="175" text-anchor="middle" font-size="28" fill="#c9963a" opacity=".3">♛</text>

  <!-- Gold corner ornaments -->
  <text x="85" y="87" font-size="10" fill="#c9963a" opacity=".8">✦</text>
  <text x="204" y="87" font-size="10" fill="#c9963a" opacity=".8">✦</text>
  <text x="85" y="214" font-size="10" fill="#c9963a" opacity=".8">✦</text>
  <text x="204" y="214" font-size="10" fill="#c9963a" opacity=".8">✦</text>

  <!-- Names -->
  <text x="150" y="250" text-anchor="middle" font-size="11" fill="#c9963a" font-family="Georgia,serif" font-style="italic">Siti Nurhaliza</text>
  <rect x="130" y="254" width="40" height="1" fill="url(#gold)"/>
  <text x="150" y="264" text-anchor="middle" font-size="14" fill="#f5d98b" font-family="Georgia,serif">&amp;</text>
  <rect x="130" y="267" width="40" height="1" fill="url(#gold)"/>
  <text x="150" y="278" text-anchor="middle" font-size="11" fill="#c9963a" font-family="Georgia,serif" font-style="italic">Ahmad Dhani</text>

  <!-- Date bar -->
  <rect x="60" y="290" width="180" height="28" rx="3" fill="#162040" stroke="#c9963a" stroke-width=".8"/>
  <text x="150" y="308" text-anchor="middle" font-size="9" fill="#f5d98b" font-family="Georgia,serif" letter-spacing="2">SABTU, 14 MARET 2026</text>

  <!-- Countdown row -->
  <rect x="40" y="330" width="220" height="40" rx="4" fill="#0d1728"/>
  <text x="80" y="345" text-anchor="middle" font-size="18" fill="#f5d98b" font-family="Georgia,serif" font-weight="bold">32</text>
  <text x="80" y="362" text-anchor="middle" font-size="7" fill="#c9963a" letter-spacing="1">HARI</text>
  <text x="120" y="353" text-anchor="middle" font-size="20" fill="#c9963a">:</text>
  <text x="150" y="345" text-anchor="middle" font-size="18" fill="#f5d98b" font-family="Georgia,serif" font-weight="bold">08</text>
  <text x="150" y="362" text-anchor="middle" font-size="7" fill="#c9963a" letter-spacing="1">JAM</text>
  <text x="180" y="353" text-anchor="middle" font-size="20" fill="#c9963a">:</text>
  <text x="220" y="345" text-anchor="middle" font-size="18" fill="#f5d98b" font-family="Georgia,serif" font-weight="bold">45</text>
  <text x="220" y="362" text-anchor="middle" font-size="7" fill="#c9963a" letter-spacing="1">MENIT</text>

  <!-- Event cards -->
  <rect x="40" y="382" width="100" height="70" rx="4" fill="#162040" stroke="#c9963a" stroke-width=".8"/>
  <text x="90" y="400" text-anchor="middle" font-size="8" fill="#c9963a" font-family="Georgia,serif">AKAD NIKAH</text>
  <text x="90" y="414" text-anchor="middle" font-size="7" fill="#f5d98b">Sabtu, 14 Mar</text>
  <text x="90" y="426" text-anchor="middle" font-size="7" fill="#9aa" opacity=".7">08.00 WIB</text>
  <text x="90" y="440" text-anchor="middle" font-size="7" fill="#9aa" opacity=".7">Grand Ballroom</text>

  <rect x="160" y="382" width="100" height="70" rx="4" fill="#162040" stroke="#c9963a" stroke-width=".8"/>
  <text x="210" y="400" text-anchor="middle" font-size="8" fill="#c9963a" font-family="Georgia,serif">RESEPSI</text>
  <text x="210" y="414" text-anchor="middle" font-size="7" fill="#f5d98b">Sabtu, 14 Mar</text>
  <text x="210" y="426" text-anchor="middle" font-size="7" fill="#9aa" opacity=".7">11.00 WIB</text>
  <text x="210" y="440" text-anchor="middle" font-size="7" fill="#9aa" opacity=".7">Hotel Mulia</text>

  <!-- Bottom line -->
  <rect x="60" y="464" width="180" height="1" fill="url(#gold)" opacity=".4"/>
  <text x="150" y="478" text-anchor="middle" font-size="7" fill="#c9963a" letter-spacing="2" opacity=".6">VIP · CINEMATIC ROYAL</text>
</svg>
